services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reservata
      POSTGRES_PASSWORD: reservata
      POSTGRES_DB: reservata
    ports:
      - "5432:5432"
    volumes:
      - reservata-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservata"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  reservata-pgdata:
